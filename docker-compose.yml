version: '3.8'

services:
  # MongoDB local development instance
  mongo:
    image: mongo:7.0
    container_name: resumeforge-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: resumeforge

  # Backend Express Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resumeforge-server
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/resumeforge
      JWT_SECRET: dev_docker_secret_key
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend Vite Dev Server
  frontend:
    image: node:20-slim
    container_name: resumeforge-frontend
    working_dir: /app
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - server

volumes:
  mongo_data:
